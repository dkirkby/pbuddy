[project]
name = "pbuddy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pbva-api",
    "pbva-worker",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/db",
    "packages/pipeline",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
pbva-core = { workspace = true }
pbva-db = { workspace = true }
pbva-pipeline = { workspace = true }
pbva-api = { workspace = true }
pbva-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: marks tests as slow (run with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py312"
